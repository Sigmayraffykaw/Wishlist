<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07070b">
<title>Bruhwiks' Wishlist</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="glow glow-1"></div><div class="glow glow-2"></div>
<main>
<header>
  <div class="tag">✦ BRUHWIKS</div>
  <h1>My Wishlist<span>.</span></h1>
  <p>A few things I'm saving up for.</p>
</header>
<section class="summary">
  <div><small>WISHLIST</small><strong>2 items</strong></div>
  <div class="summary-total"><small>TOTAL</small><strong>A$1,828</strong></div>
</section>
<section class="grid">
  <article class="card printer">
    <div class="card-top"><div class="icon">🖨️</div><span class="priority">HIGH PRIORITY</span></div>
    <div class="content"><h2>Bambu Lab A1</h2><p>A beginner-friendly 3D printer for making cool stuff.</p></div>
    <div class="bottom"><b>A$429</b><div class="dot"></div></div>
  </article>
  <article class="card phone">
    <div class="card-top"><div class="icon">📱</div><span class="priority">HIGH PRIORITY</span></div>
    <div class="content"><h2>iPhone 17 <em>256GB</em></h2><p>A new iPhone for the wishlist.</p></div>
    <div class="bottom"><b>A$1,399</b><div class="dot"></div></div>
  </article>
</section>
<footer><span>🎁 Wishlist</span><span>Updated 2026</span></footer>
</main>
</body>
</html>
